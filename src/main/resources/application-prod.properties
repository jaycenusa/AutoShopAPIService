# Production / hosted profile — Render sets PORT and DATABASE_URL
server.port=${PORT:8080}

# Datasource URL/user/password come from DATABASE_URL via DatabaseUrlEnvironmentPostProcessor.
# Optional explicit overrides (must be jdbc:postgresql://... if set):
# SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
